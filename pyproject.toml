[project]
name = "study-with-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
study-with-ai = "study_with_ai:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
